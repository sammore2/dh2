<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="evasionBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="60%" stop-color="#141726" />
      <stop offset="100%" stop-color="#0e101b" />
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="archShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arch Silhouette -->
  <path d="M 6 74
           L 6 38
           A 34 34 0 0 1 74 38
           L 74 74
           Z"
        fill="url(#evasionBg)"
        stroke="url(#cyanBorder)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#archShadow)" />

  <!-- Inner Inset Arch -->
  <path d="M 11 70
           L 11 38
           A 29 29 0 0 1 69 38
           L 69 70
           Z"
        fill="none"
        stroke="#1e3a5f"
        stroke-width="1"
        stroke-opacity="0.8" />
</svg>
