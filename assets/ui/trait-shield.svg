<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" preserveAspectRatio="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242436" />
      <stop offset="60%" stop-color="#171724" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061" />
      <stop offset="50%" stop-color="#b8892e" />
      <stop offset="100%" stop-color="#694d13" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Main Shield Body -->
  <path d="M 10 18
           Q 46 25 80 18
           L 92 24
           L 92 72
           Q 90 95 50 116
           Q 10 95 8 72
           L 8 24
           Z"
        fill="url(#shieldBg)"
        stroke="url(#goldBorder)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#shieldGlow)" />

  <!-- Inner Inset Contour -->
  <path d="M 14 24
           Q 46 30 76 24
           L 86 28
           L 86 70
           Q 84 90 50 110
           Q 16 90 14 70
           L 14 28
           Z"
        fill="none"
        stroke="#4a3e23"
        stroke-width="1"
        stroke-opacity="0.6" />

  <!-- Top-Right Corner Socket Accent -->
  <circle cx="86" cy="18" r="7" fill="#181826" stroke="url(#goldBorder)" stroke-width="2" />
  <circle cx="86" cy="18" r="3.5" fill="#f5d061" opacity="0.8" />
</svg>
